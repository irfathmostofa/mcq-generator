project_id = "ai-mcq-exam-platform"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
enable_signup = false

[functions.generate-mcq]
verify_jwt = true

[functions.extract-pdf]
verify_jwt = true

[functions.start-exam]
verify_jwt = false

[functions.submit-exam]
verify_jwt = false

[functions.save-answers]
verify_jwt = false

[functions.evaluate-exam]
verify_jwt = false

[functions.exam-public]
verify_jwt = false
